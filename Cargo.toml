[package]
name = "plars"
version = "0.1.0"
edition = "2021"
description = "A GTK4 Typst editor for Linux with live preview and debugging via tinymist"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview5 = { version = "0.11", features = ["v5_12"] }
webkit6 = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
regex = "1"
url = "2"
toml = "0.8"

[features]
default = ["webkit"]
# Embedded preview and docs (WebKitGTK). Without it, e.g. on macOS and
# Windows where WebKitGTK isn't packaged, they open in the web browser.
webkit = ["dep:webkit6"]

[profile.release]
lto = "thin"
