[package]
name = "plars"
version = "0.2.2"
edition = "2021"
description = "A GTK4 Typst editor for Linux with live preview and debugging via tinymist"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
sourceview5 = { version = "0.11", features = ["v5_12"] }
webkit6 = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
regex = "1"
url = "2"
toml = "0.8"
# Built-in bitmap preview: compile and rasterize in-process
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-ide = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime"] }

[features]
default = ["webkit"]
# Embedded preview and docs (WebKitGTK). Without it, e.g. on macOS and
# Windows where WebKitGTK isn't packaged, they open in the web browser.
webkit = ["dep:webkit6"]

[profile.release]
lto = "thin"
